<!doctype html>
<html><head><meta charset="utf-8"><title>Sheet Slicer</title>
<style>body{margin:0;background:#222;color:#fff;font:12px monospace} canvas{image-rendering:pixelated;display:block}</style></head>
<body><canvas id="c"></canvas><pre id="out"></pre>
<script>
// Finds every sprite on a white-background sheet (connected blobs, merged when close)
// and draws numbered boxes so frames can be mapped to animations.
const q = new URLSearchParams(location.search);
const src = q.get('sheet') || 'goku';
const minX = +(q.get('minX') || 0), maxX = +(q.get('maxX') || 99999), gap = +(q.get('gap') || 3);
const img = new Image();
img.onload = () => {
  const W = img.width, H = img.height;
  const c = document.getElementById('c'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, W, H).data;
  const fg = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) {
    const px = i % W;
    if (px < minX || px > maxX) continue;
    const r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2];
    fg[i] = (r < 235 || g < 235 || b < 235) ? 1 : 0;
  }
  // dilate by `gap` so near pieces (hair tips, sparks) join their sprite
  const dl = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) for (let xx = 0; xx < W; xx++) if (fg[y * W + xx])
    for (let dy = -gap; dy <= gap; dy++) for (let dx = -gap; dx <= gap; dx++) {
      const nx = xx + dx, ny = y + dy; if (nx >= 0 && ny >= 0 && nx < W && ny < H) dl[ny * W + nx] = 1;
    }
  const lab = new Int32Array(W * H), boxes = [];
  for (let i = 0; i < W * H; i++) {
    if (!dl[i] || lab[i]) continue;
    const id = boxes.length + 1, st = [i]; lab[i] = id;
    let b = { x0: 1e9, y0: 1e9, x1: -1, y1: -1, n: 0 };
    while (st.length) {
      const j = st.pop(), jx = j % W, jy = (j / W) | 0;
      if (fg[j]) { b.x0 = Math.min(b.x0, jx); b.y0 = Math.min(b.y0, jy); b.x1 = Math.max(b.x1, jx); b.y1 = Math.max(b.y1, jy); b.n++; }
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = jx + dx, ny = jy + dy, k = ny * W + nx;
        if (nx >= 0 && ny >= 0 && nx < W && ny < H && dl[k] && !lab[k]) { lab[k] = id; st.push(k); }
      }
    }
    boxes.push(b);
  }
  const keep = boxes.filter(b => b.n > 40).map(b => [b.x0, b.y0, b.x1 - b.x0 + 1, b.y1 - b.y0 + 1]);
  keep.sort((a, b) => (a[1] + a[3]) - (b[1] + b[3]));
  // group into rows by overlapping vertical extent, then sort by x
  const rows = [];
  for (const b of keep) {
    const r = rows.find(r => b[1] < r.y1 && b[1] + b[3] > r.y0);
    if (r) { r.items.push(b); r.y0 = Math.min(r.y0, b[1]); r.y1 = Math.max(r.y1, b[1] + b[3]); }
    else rows.push({ y0: b[1], y1: b[1] + b[3], items: [b] });
  }
  rows.sort((a, b) => a.y0 - b.y0);
  rows.forEach(r => r.items.sort((a, b) => a[0] - b[0]));
  x.font = 'bold 10px monospace'; x.lineWidth = 1;
  rows.forEach((r, ri) => r.items.forEach((b, bi) => {
    x.strokeStyle = '#f0f'; x.strokeRect(b[0] - 0.5, b[1] - 0.5, b[2] + 1, b[3] + 1);
    x.fillStyle = '#000'; x.fillRect(b[0], b[1] - 9, 26, 9);
    x.fillStyle = '#0f0'; x.fillText(ri + '.' + bi, b[0] + 1, b[1] - 1);
  }));
  window.ROWS = rows.map(r => r.items);
  document.getElementById('out').textContent = JSON.stringify(window.ROWS);
};
img.src = '../assets/sheets/' + src + '.png';
</script></body></html>
